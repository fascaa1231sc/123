<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vorflux Proxy Node</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { color-scheme: dark; }
  </style>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-200 antialiased">
  <main class="mx-auto max-w-2xl px-6 py-16 space-y-12">

    <!-- Header + service status -->
    <section class="space-y-4">
      <div class="flex items-center gap-3">
        <span id="status-dot" class="inline-block h-3 w-3 rounded-full bg-neutral-600"></span>
        <h1 class="text-2xl font-semibold tracking-tight text-neutral-100">Vorflux Proxy Node</h1>
      </div>
      <p id="status-text" class="text-sm text-neutral-400">Checking service status&hellip;</p>
    </section>

    <!-- Node address -->
    <section class="space-y-2">
      <h2 class="text-xs font-medium uppercase tracking-widest text-neutral-500">Node Address</h2>
      <p id="node-address" class="font-mono text-sm text-neutral-200 break-all">&mdash;</p>
    </section>

    <!-- One-line notice -->
    <section>
      <p class="text-sm text-neutral-400">
        This is a proxy node. Use the Base URL and your PROXY_API_KEY to connect.
      </p>
    </section>

    <!-- Supported models, grouped by vendor -->
    <section class="space-y-4">
      <div class="flex items-baseline justify-between">
        <h2 class="text-xs font-medium uppercase tracking-widest text-neutral-500">Supported Models</h2>
        <span id="model-count" class="text-xs text-neutral-500"></span>
      </div>
      <div id="model-groups" class="space-y-5">
        <p class="text-sm text-neutral-500">Loading models&hellip;</p>
      </div>
    </section>

  </main>

  <script>
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const nodeAddress = document.getElementById("node-address");
    const modelGroups = document.getElementById("model-groups");
    const modelCount = document.getElementById("model-count");

    nodeAddress.textContent = window.location.origin;

    async function checkHealth() {
      const started = performance.now();
      try {
        const res = await fetch("/api/healthz", { cache: "no-store" });
        if (!res.ok) throw new Error("bad status " + res.status);
        const data = await res.json();
        const ms = Math.round(performance.now() - started);
        if (data.status === "ok") {
          statusDot.className = "inline-block h-3 w-3 rounded-full bg-emerald-500";
          statusText.textContent = "Service online \u00b7 " + ms + " ms";
        } else {
          throw new Error("unexpected payload");
        }
      } catch {
        statusDot.className = "inline-block h-3 w-3 rounded-full bg-red-500";
        statusText.textContent = "Service offline";
      }
    }

    async function loadModels() {
      try {
        const res = await fetch("/api/status/models", { cache: "no-store" });
        if (!res.ok) throw new Error();
        const data = await res.json();
        modelCount.textContent = data.total + " models";
        modelGroups.innerHTML = "";
        for (const group of data.groups) {
          const wrap = document.createElement("div");
          wrap.className = "space-y-2";
          const title = document.createElement("h3");
          title.className = "text-sm font-medium text-neutral-300";
          title.textContent = group.vendor;
          const list = document.createElement("div");
          list.className = "flex flex-wrap gap-1.5";
          for (const id of group.models) {
            const chip = document.createElement("span");
            chip.className =
              "rounded border border-neutral-800 bg-neutral-900 px-2 py-0.5 font-mono text-xs text-neutral-400";
            chip.textContent = id;
            list.appendChild(chip);
          }
          wrap.appendChild(title);
          wrap.appendChild(list);
          modelGroups.appendChild(wrap);
        }
      } catch {
        modelGroups.innerHTML = "";
        const p = document.createElement("p");
        p.className = "text-sm text-neutral-500";
        p.textContent = "Failed to load model list.";
        modelGroups.appendChild(p);
      }
    }

    checkHealth();
    loadModels();
    setInterval(checkHealth, 30000);
  </script>
</body>
</html>
